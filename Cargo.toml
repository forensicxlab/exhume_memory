[package]
name = "exhume_memory"
version = "0.1.3"
edition = "2024"
description = "Volatile memory forensics for exhume"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/forensicxlab/exhume_memory"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
# All connectors and scanners use the forensicxlab Git forks. Their manifests
# must in turn use the same memflow Git source to preserve Rust trait identity.
memflow = { version = "0.2.4", git = "https://github.com/forensicxlab/memflow", branch = "main" }
memflow-rawmem = { version = "0.2.0", git = "https://github.com/forensicxlab/memflow-rawmem", branch = "main" }
memflow-win32 = { version = "0.2.0", git = "https://github.com/forensicxlab/memflow-win32", branch = "main" }
memflow-pcileech = { version = "0.2.0", git = "https://github.com/forensicxlab/memflow-pcileech", rev = "1756dfd24574190ac13d0c70ac2e2ee1d16c9496" }
memflow-linux = { version = "0.2.0", git = "https://github.com/forensicxlab/memflow-linux", branch = "master" }
scanflow = { version = "0.2.1", git = "https://github.com/forensicxlab/scanflow", branch = "main" }

hex = "0.4"
rayon = "1.8"
memchr = "2.7"
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"
prettytable = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
memflow-kvm = { version = "0.2.1", git = "https://github.com/forensicxlab/memflow-kvm", branch = "main" }
